<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Song List</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .artist {
            margin-top: 25px;
            margin-bottom: 8px;
            font-size: 20px;
            font-weight: bold;
        }

        .song {
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <h1>歌える曲リスト</h1>

    <div id="song-list">
        読み込み中...
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const supabaseUrl = 'https://dgssybbbgnnygmccjltn.supabase.co';
        const supabaseKey = 'sb_publishable_JNz1mi6gysaFjOa0A4I5ow_iDe3PQbd';

        const supabaseClient = window.supabase.createClient(
            supabaseUrl,
            supabaseKey
        );


        async function loadSongs() {

            const list = document.getElementById('song-list');

            const { data, error } = await supabaseClient
                .from('songs')
                .select('*')
                .eq('streamer_id', 1)
                .order('artist_initial')
                .order('artist')
                .order('title');


            if (error) {
                list.textContent = 'エラー：' + error.message;
                console.error(error);
                return;
            }


            list.innerHTML = '';


            let currentArtist = '';


            data.forEach(song => {

                // アーティストが変わったら見出しを作る
                if (song.artist !== currentArtist) {

                    const artist = document.createElement('div');

                    artist.className = 'artist';
                    artist.textContent = song.artist;

                    list.appendChild(artist);

                    currentArtist = song.artist;
                }


                // 曲名
                const div = document.createElement('div');

                div.className = 'song';

                div.textContent =
                    song.title +
                    (song.complete ? ' ★' : '');

                list.appendChild(div);

            });

        }


        loadSongs();

    </script>

</body>
</html>
