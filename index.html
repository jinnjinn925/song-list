<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Song List</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <h1>Song List</h1>

    <div id="artist-nav"></div>

    <div id="song-list">
        読み込み中...
    </div>


    <script>

        // Supabaseへの接続
        const supabaseUrl = 'https://dgssybbbgnnygmccjltn.supabase.co';

        const supabaseKey =
            'sb_publishable_JNz1mi6gysaFjOa0A4I5ow_iDe3PQbd';

        const supabaseClient =
            window.supabase.createClient(
                supabaseUrl,
                supabaseKey
            );


        const list = document.getElementById('song-list');
        const nav = document.getElementById('artist-nav');


        // 50音・アルファベット
        const initials = [
            'A-Z',
            'あ', 'か', 'さ', 'た', 'な',
            'は', 'ま', 'や', 'ら', 'わ'
        ];


        // 各行に含まれる文字
        const initialGroups = {
            'あ': ['あ', 'い', 'う', 'え', 'お'],
            'か': ['か', 'き', 'く', 'け', 'こ'],
            'さ': ['さ', 'し', 'す', 'せ', 'そ'],
            'た': ['た', 'ち', 'つ', 'て', 'と'],
            'な': ['な', 'に', 'ぬ', 'ね', 'の'],
            'は': ['は', 'ひ', 'ふ', 'へ', 'ほ'],
            'ま': ['ま', 'み', 'む', 'め', 'も'],
            'や': ['や', 'ゆ', 'よ'],
            'ら': ['ら', 'り', 'る', 'れ', 'ろ'],
            'わ': ['わ', 'を', 'ん']
        };


        // 曲を表示する関数
        function displaySongs(songs) {

            list.innerHTML = '';

            let currentArtist = '';


            songs.forEach(song => {

                // アーティストが変わったら見出しを作る
                if (song.artist !== currentArtist) {

                    currentArtist = song.artist;

                    const artistDiv =
                        document.createElement('div');

                    artistDiv.textContent = song.artist;
                    artistDiv.className = 'artist';

                    list.appendChild(artistDiv);
                }


                // 曲名を表示
                const songDiv =
                    document.createElement('div');

                songDiv.textContent =
                    song.title +
                    (song.complete ? ' ★' : '');

                songDiv.className = 'song';

                list.appendChild(songDiv);
            });
        }


        // 50音ボタンを作る
        initials.forEach(initial => {

            const button =
                document.createElement('button');

            button.textContent = initial;


            // ボタンを押したとき
            button.addEventListener('click', () => {

                // A-Zの場合
                if (initial === 'A-Z') {

                    displaySongs(
                        data.filter(song =>
                            /^[a-z]/i.test(
                                song.artist_initial
                            )
                        )
                    );

                    return;
                }


                // 50音の場合
                const group =
                    initialGroups[initial];


                displaySongs(
                    data.filter(song =>
                        group.some(letter =>
                            song.artist_initial
                                .startsWith(letter)
                        )
                    )
                );
            });


            nav.appendChild(button);
        });


        // Supabaseから曲を取得
        async function loadSongs() {

            const { data: songs, error } =
                await supabaseClient
                    .from('songs')
                    .select('*')
                    .eq('streamer_id', 1);


            if (error) {

                console.error(error);

                list.textContent =
                    '読み込みに失敗しました';

                return;
            }


            // 取得したデータを保存
            const collator = new Intl.Collator('ja', {
                sensitivity: 'base'
            });

            songs.sort((a, b) => {
                // アーティストの読み順
                const artistResult = collator.compare(
                    a.artist_initial,
                    b.artist_initial
                );

                if (artistResult !== 0) {
                    return artistResult;
                }

                // 同じアーティストなら曲名の読み順
                return collator.compare(
                    a.title_initial,
                    b.title_initial
                );
            });
            window.data = songs;


            // 最初は全部表示
            displaySongs(data);
        }


        loadSongs();

    </script>

</body>
</html>
