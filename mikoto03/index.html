<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ここにあった shortcut icon の行を削除し、以下を追加 -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <title>Song List</title>
    
    <!-- 1. Google Fonts の読み込み（Noto Sans JP） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSSの読み込み -->
    <link rel="stylesheet" href="mikoto.css">

    <!-- 動的に取得したデザイン（フォント・各文字色・背景など）を反映するための要素 -->
    <style id="dynamic-styles"></style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header id="page-header">
        <!-- タイトル（title_color を反映する対象） -->
        <h1 id="streamer-name"></h1>

        <div id="song-count">
            曲数：読み込み中...
        </div>
    </header>

    <!-- 下部固定操作パネル -->
	<div id="menu-panel" class="menu-panel">

		<!-- メニュー展開エリア（「すべて▼」で開閉） -->
		<div id="mode-menu" class="mode-menu">

			<!-- グループ1：完成度（単一選択） -->
			<div class="filter-section">
				<span class="filter-label">完成度</span>
				<div class="filter-tabs">
					<button id="filter-all" class="tab-btn active">すべて</button>
					<button id="filter-complete" class="tab-btn">フル</button>
					<button id="filter-partial" class="tab-btn">途中まで</button>
					<button id="filter-practice" class="tab-btn">練習中</button>
				</div>
			</div>

			<!-- グループ2：クイックフィルター（ON/OFFトグル） -->
			<div class="filter-section">
				<span class="filter-label">絞り込み</span>
				<div id="favorite-artists" class="filter-chips">
					<!-- JSで「★ 自信曲」「♥ 好きな歌手」などをチップ形式で描画 -->
					<button class="chip-btn" data-type="confident">自信曲</button>
					<button class="chip-btn" data-type="favorite">好きな歌手</button>
				</div>
			</div>

		</div>

		<!-- 50音ナビゲーション（☰で開閉） -->
		<div id="artist-nav"></div>

		<!-- 常に最下部に表示される操作バー -->
		<div id="control-area">
			<button id="current-mode" type="button">フィルター ▼</button>
			<div class="search-box">
				<input id="song-search" type="search" placeholder="曲名・アーティスト名で検索" autocomplete="off">
				<button id="search-clear" type="button">クリア</button>
			</div>
			<button id="menu-button" type="button" aria-label="50音メニュー">☰</button>
		</div>

	</div>
    

   

    <!-- 曲一覧・アーティスト名部分 -->
    <div id="song-list">
        読み込み中...
    </div>

    <script src="mikoto.js"></script>

</body>
</html>
