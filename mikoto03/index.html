<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ここにあった shortcut icon の行を削除し、以下を追加 -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <title>Song List</title>
    
    <!-- 1. Google Fonts の読み込み（Noto Sans JP） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSSの読み込み -->
    <link rel="stylesheet" href="mikoto.css">

    <!-- 動的に取得したデザイン（フォント・各文字色・背景など）を反映するための要素 -->
    <style id="dynamic-styles"></style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header id="page-header">
        <!-- タイトル（title_color を反映する対象） -->
        <h1 id="streamer-name"></h1>

        <div id="song-count">
            曲数：読み込み中...
        </div>
    </header>

    <!-- 下部操作バー -->
    <div id="menu-panel" class="menu-panel">

        <!-- 表示操作エリア（一列に並ぶ3つの要素） -->
        <div id="control-area">

            <!-- 1. 現在の表示状態 -->
            <button id="current-mode" type="button">
                すべて ▼
            </button>

            <!-- 2. 検索 -->
            <div class="search-box">
                <input
                    id="song-search"
                    type="search"
                    placeholder="曲名・アーティスト名で検索"
                    autocomplete="off"
                >
                <button id="search-clear" type="button">
                    クリア
                </button>
            </div>

            <!-- 3. ハンバーガーボタン -->
            <button
                id="menu-button"
                type="button"
                aria-label="50音メニュー"
            >
                ☰
            </button>

        </div>

        <!-- 現在の表示状態の選択メニュー -->
        <div id="mode-menu">
            <button id="filter-all" class="favorite-button active">
                すべて
            </button>
            <button id="filter-complete" class="favorite-button">
                フル
            </button>
            <button id="filter-partial" class="favorite-button">
                途中まで
            </button>
            <button id="filter-practice" class="favorite-button">
                練習中
            </button>
            <div id="favorite-artists"></div>
        </div>

        <!-- 50音メニュー（1つだけに整理） -->
        <div id="artist-nav"></div>

    </div>

    

   

    <!-- 曲一覧・アーティスト名部分 -->
    <div id="song-list">
        読み込み中...
    </div>

    <script src="mikoto.js"></script>

</body>
</html>
