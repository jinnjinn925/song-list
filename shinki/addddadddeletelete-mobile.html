<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>レパートリー管理</title>

    <link rel="stylesheet" href="add-mobile.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="add.js" defer></script>
</head>

<body>
<main class="add-main">

    <header class="page-header">
        <h1>レパートリー管理</h1>
        <p>スマートフォン用管理画面</p>
    </header>

    <input type="hidden" id="streamer-id">

    <section id="management-key-section" class="management-section">
        <label for="management-key">管理キー</label>
        <input
            type="password"
            id="management-key"
            placeholder="管理キーを入力"
            autocomplete="off"
        >
    </section>
	
	<div id="reset-key-area">

		<button
			type="button"
			id="show-reset-btn"
			class="sub-button"
		>
			管理キーを忘れた場合
		</button>

		<div id="reset-form" style="display:none;">

			<label for="reset-key">
				再設定コード
			</label>

			<input
				type="text"
				id="reset-key"
				placeholder="再設定コードを入力"
				autocomplete="off"
			>

			<label for="new-management-key">
				新しい管理キー
			</label>

			<input
				type="password"
				id="new-management-key"
				placeholder="新しい管理キー"
				autocomplete="new-password"
			>

			<label for="new-management-key-confirm">
				新しい管理キー（確認）
			</label>

			<input
				type="password"
				id="new-management-key-confirm"
				placeholder="もう一度入力"
				autocomplete="new-password"
			>

			<button
				type="button"
				id="reset-management-key-btn"
				class="main-button"
			>
				管理キーを再設定
			</button>

			<div id="reset-message"></div>

		</div>

	</div>

    <section id="input-section" class="management-section">
        <div class="section-header">
            <h2>曲を入力</h2>
            <p>1曲ずつ入力してください。<br>苗字と名前の間にスペースをいれてください!!!<br>「＋ 曲を追加」で入力欄を増やせます。</p>
        </div>

        <div class="mobile-table">
            <table class="song-table input-table">
                <thead>
                    <tr>
                        <th>アーティスト</th>
                        <th>曲名</th>
                        <th>歌える状態</th>
                        <th>自信曲</th>
                        <th class="delete-column"></th>
                    </tr>
                </thead>
                <tbody id="input-body"></tbody>
            </table>
        </div>

        <button type="button" id="add-row-btn" class="add-row-button">
            ＋ 曲を追加
        </button>

        <button type="button" id="generate-btn" class="main-button">
            まとめて登録する
        </button>

        <div id="submit-error"></div>
    </section>

    <section id="preview-section" class="management-section" style="display:none;">
        <div class="section-header">
            <h2>読みを確認</h2>
            <p>自動生成された読みを確認してください。<br>間違っているところは直接修正できます。</p>
        </div>

        <div class="mobile-table">
            <table class="song-table preview-table">
                <thead>
                    <tr>
                        <th>アーティスト</th>
                        <th>アーティスト読み</th>
                        <th>曲名</th>
                        <th>曲名読み</th>
                        <th>歌える状態</th>
                        <th>自信曲</th>
                        <th class="delete-column"></th>
                    </tr>
                </thead>
                <tbody id="preview-body"></tbody>
            </table>
        </div>

        <button type="button" id="back-btn" class="sub-button">
            入力に戻る
        </button>

        <button type="button" id="submit-all-btn" class="main-button">
            この内容で一括登録する
        </button>
    </section>

    <section id="registered-section" class="management-section">
        <div class="section-header">
            <h2>登録済みの曲</h2>
            <p>削除したい曲にチェックを入れてください。</p>
        </div>

        <div class="registered-controls">

		<div class="registered-search-row">

			<input
				type="search"
				id="registered-search"
				placeholder="アーティスト・曲名を検索"
				autocomplete="off"
			>

			<select id="registered-sort">
				<option value="artist">アーティスト順</option>
				<option value="title">曲名順</option>
				<option value="newest">登録が新しい順</option>
			</select>

		</div>


		<div class="registered-action-row">

			<label class="select-all-label">
				<input
					type="checkbox"
					id="select-all-songs"
				>
				表示中をすべて選択
			</label>


			<button
				type="button"
				id="reload-songs-btn"
				class="sub-button"
			>
				↻曲一覧を更新
			</button>

		</div>

	</div>

        <div class="mobile-table">
            <table class="song-table registered-table">
                <thead>
                    <tr>
                        <th>選択</th>
                        <th>アーティスト</th>
                        <th>曲名</th>
                        <th>歌える状態</th>
                        <th>自信曲</th>
                    </tr>
                </thead>
                <tbody id="registered-body"></tbody>
            </table>
        </div>

        <button type="button" id="delete-selected-btn" class="delete-button">
            選択した曲を削除
        </button>
    </section>

    <div id="message"></div>

</main>
</body>
</html>
