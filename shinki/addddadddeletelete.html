<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">

    <title>レパートリー管理</title>

    <link rel="stylesheet" href="add.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 処理スクリプト -->
    <script src="add.js" defer></script>
</head>

<body>

<main class="add-main">
	
	<section id="management-key-section">
    	<label for="management-key">
        	管理キー
    	</label>

    	<input
        	type="password"
        	id="management-key"
        	placeholder="管理キーを入力"
        	autocomplete="off"
    	>
	</section>

    <h2>レパートリー管理</h2>

    <input type="hidden" id="streamer-id">


    <!-- =========================
         曲を追加
    ========================== -->

    <section id="input-section">

        <div class="section-header">

            <div>
                <h3>曲を追加</h3>

                <p>
                    1行に1曲ずつ入力してください。
                    「＋行を追加」で曲を増やせます。
                </p>
            </div>

        </div>


        <!-- 曲入力テーブル -->

        <div class="table-scroll">

            <table class="song-table input-table">

                <thead>
                    <tr>
                        <th>アーティスト</th>
                        <th>曲名</th>
                        <th>歌える状態</th>
                        <th>自信曲</th>
                        <th>イントロ</th>
                        <th class="delete-column"></th>
                    </tr>
                </thead>

                <tbody id="input-body">
                </tbody>

            </table>

        </div>


        <button
            type="button"
            id="add-row-btn"
            class="add-row-button">
            ＋ 行を追加
        </button>


        <button
            type="button"
            id="generate-btn"
            class="main-button">
            全曲のひらがなを生成
        </button>
		
		<div id="submit-error"></div>

    </section>


    <!-- =========================
         読み確認
    ========================== -->

    <section
        id="preview-section"
        style="display:none;">

        <div class="section-header">

            <div>
                <h3>読みを確認</h3>

                <p>
                    自動生成された読みを確認してください。
                    間違っているところは直接修正できます。
                </p>
            </div>

        </div>


        <div class="table-scroll">

            <table class="song-table preview-table">

                <thead>
                    <tr>
                        <th>アーティスト</th>
                        <th>アーティスト読み</th>
                        <th>曲名</th>
                        <th>曲名読み</th>
                        <th>歌える状態</th>
                        <th>自信曲</th>
                        <th>イントロ</th>
                        <th class="delete-column"></th>
                    </tr>
                </thead>

                <tbody id="preview-body">
                </tbody>

            </table>

        </div>


        <button
            type="button"
            id="back-btn"
            class="sub-button">
            入力に戻る
        </button>


        <button
            type="button"
            id="submit-all-btn"
            class="main-button">
            この内容で一括登録する
        </button>
		
		<div id="submit-error"></div>

    </section>


    <!-- =========================
         登録済みの曲を削除
    ========================== -->

    <section id="registered-section">

        <div class="section-header">

            <div>
                <h3>登録済みの曲を削除</h3>

                <p>
                    削除したい曲にチェックを入れてください。
                </p>
            </div>

        </div>


        <!-- 全選択 -->

        <div class="registered-controls">

            <label class="select-all-label">
                <input
                    type="checkbox"
                    id="select-all-songs">
                すべて選択
            </label>

            <button
                type="button"
                id="reload-songs-btn"
                class="sub-button">
                ↻ 曲一覧を更新
            </button>

        </div>


        <!-- 登録済み曲一覧 -->

        <div class="table-scroll">

            <table class="song-table registered-table">

                <thead>
                    <tr>
                        <th>選択</th>
                        <th>アーティスト</th>
                        <th>曲名</th>
                        <th>歌える状態</th>
                        <th>自信曲</th>
                        <th>イントロ</th>
                    </tr>
                </thead>

                <tbody id="registered-body">
                </tbody>

            </table>

        </div>


        <button
            type="button"
            id="delete-selected-btn"
            class="delete-button">
            選択した曲を削除
        </button>

    </section>


    <!-- メッセージ -->

    <div id="message"></div>

</main>

</body>
</html>
