<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">

    <title>レパートリー一括登録</title>

    <link rel="stylesheet" href="ao_2.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 処理スクリプト -->
    <script src="add.js" defer></script>
</head>

<body>

<main class="add-main">

    <h2>レパートリー一括登録</h2>

    <input type="hidden" id="streamer-id">

    <!-- =========================
         入力
    ========================== -->

    <section id="input-section">

        <div class="section-header">
            <div>
                <h3>曲を入力</h3>
                <p>
                    1行に1曲ずつ入力してください。
                    「＋行を追加」で曲を増やせます。
                </p>
            </div>
        </div>

        <!-- CSV貼り付け -->
        <details class="paste-area">
            <summary>曲リストをまとめて貼り付ける</summary>

            <p>
                「アーティスト名,曲名」の形式で複数行貼り付けできます。
            </p>

            <textarea
                id="csv-input"
                rows="7"
                placeholder="ヨルシカ,言え。
コブクロ,赤い糸
Ado,唱
Hump Back,拝啓、少年よ"></textarea>

            <button
                type="button"
                id="paste-btn"
                class="sub-button">
                表に追加する
            </button>
        </details>


        <!-- 曲入力テーブル -->
        <div class="table-scroll">

            <table class="song-table input-table">

                <thead>
                    <tr>
                        <th>アーティスト</th>
                        <th>曲名</th>
                        <th>歌える状態</th>
                        <th>自信曲</th>
                        <th>イントロ</th>
                        <th class="delete-column"></th>
                    </tr>
                </thead>

                <tbody id="input-body">
                </tbody>

            </table>

        </div>


        <button
            type="button"
            id="add-row-btn"
            class="add-row-button">
            ＋ 行を追加
        </button>


        <button
            type="button"
            id="generate-btn"
            class="main-button">
            全曲のひらがなを生成
        </button>

    </section>


    <!-- =========================
         読み確認
    ========================== -->

    <section
        id="preview-section"
        style="display:none;">

        <div class="section-header">

            <div>
                <h3>読みを確認</h3>

                <p>
                    自動生成された読みを確認してください。
                    間違っているところは直接修正できます。
                </p>
            </div>

        </div>


        <div class="table-scroll">

            <table class="song-table preview-table">

                <thead>
                    <tr>
                        <th>アーティスト</th>
                        <th>アーティスト読み</th>
                        <th>曲名</th>
                        <th>曲名読み</th>
                        <th>歌える状態</th>
                        <th>自信曲</th>
                        <th>イントロ</th>
                        <th class="delete-column"></th>
                    </tr>
                </thead>

                <tbody id="preview-body">
                </tbody>

            </table>

        </div>


        <button
            type="button"
            id="back-btn"
            class="sub-button">
            入力に戻る
        </button>


        <button
            type="button"
            id="submit-all-btn"
            class="main-button">
            この内容で一括登録する
        </button>

    </section>


    <!-- メッセージ -->

    <div id="message"></div>

</main>

</body>
</html>
