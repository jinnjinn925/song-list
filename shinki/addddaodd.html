<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>レパートリー一括登録</title>
<link rel="stylesheet" href="ao_2.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="add.js" defer></script>
</head>
<body>
<main>
<h2>レパートリー一括登録</h2>

<input type="hidden" id="streamer-id">

<div id="step-1">
<p class="help">「アーティスト名,曲名」の形で1行ずつ貼り付けてください。</p>
<p class="help small">例：ヨルシカ,言え。 / コブクロ,赤い糸</p>

<textarea id="csv-input" rows="10" placeholder="ヨルシカ,言え。
コブクロ,赤い糸
Hump Back,拝啓、少年よ"></textarea>

<button type="button" id="parse-btn" class="favorite-button">
入力内容を確認する
</button>
</div>

<div id="step-2">
<h3>登録内容の確認・修正</h3>
<p class="help small">
「読み」は自動生成ではなく、必要なものだけ手入力・修正します。
</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>アーティスト</th>
<th>アーティスト読み</th>
<th>曲名</th>
<th>曲名読み</th>
</tr>
</thead>
<tbody id="preview-body"></tbody>
</table>
</div>

<button type="button" id="submit-all-btn" class="favorite-button submit-button">
この内容で一括登録する
</button>
</div>

<div id="message"></div>
</main>
</body>
</html>
