<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>レパートリー一括登録</title>
    <link rel="stylesheet" href="ao_2.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- KuromojiはWeb Worker内で読み込みます。ページを固まらせません。 -->
    <script src="add.js" defer></script>
</head>
<body>
<main style="max-width: 900px; margin: 20px auto; padding: 20px;">
    <h2>レパートリー一括登録</h2>

    <input type="hidden" id="streamer-id">

    <div id="step-1">
        <p style="font-size:14px; color:#555;">
            「アーティスト名,曲名」の形で貼り付けてください。タブ区切りにも対応しています。
        </p>

        <textarea id="csv-input" rows="10" style="width:100%; padding:10px;"
            placeholder="ヨルシカ,言え。
コブクロ,赤い糸
Hump Back,拝啓、少年よ"></textarea>

        <button type="button" id="parse-btn" class="favorite-button"
            style="width:100%; margin-top:10px; padding:12px;">
            ふりがなを自動生成して確認する
        </button>
    </div>

    <div id="step-2" style="display:none; margin-top:24px;">
        <h3>登録内容の確認・修正</h3>
        <p style="font-size:13px; color:#666;">
            自動生成された読みは必ず確認してください。間違っている箇所は直接修正できます。
        </p>

        <div style="overflow-x:auto;">
            <table style="width:100%; border-collapse:collapse; margin-top:10px; min-width:760px;">
                <thead>
                    <tr style="background:#f0f0f0; text-align:left;">
                        <th style="padding:8px;">アーティスト</th>
                        <th style="padding:8px;">読み</th>
                        <th style="padding:8px;">曲名</th>
                        <th style="padding:8px;">読み</th>
                    </tr>
                </thead>
                <tbody id="preview-body"></tbody>
            </table>
        </div>

        <button type="button" id="submit-all-btn" class="favorite-button"
            style="width:100%; margin-top:16px; padding:12px; font-weight:bold;">
            この内容で一括登録する
        </button>
    </div>

    <div id="message" style="margin-top:15px; font-weight:bold;"></div>
</main>
</body>
</html>
