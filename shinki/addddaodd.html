<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>レパートリー一括登録</title>
<link rel="stylesheet" href="ao_2.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="add.js" defer></script>
</head>
<body>
<main>
<h2>レパートリー一括登録</h2>

<input type="hidden" id="streamer-id">

<section id="step-1">
<p class="help">
曲リストをそのまま貼り付けてください。
</p>
<p class="help small">
対応：タブ区切り／カンマ区切り／全角カンマ／2個以上のスペース区切り／一般的な「アーティスト 曲名」形式
</p>

<textarea id="csv-input" rows="12" placeholder="ヨルシカ　言え。
コブクロ　赤い糸
Hump Back　拝啓、少年よ
Mrs. GREEN APPLE　ダーリン"></textarea>

<div class="options">
<label>
<input type="checkbox" id="keep-invalid">
分割できない行も確認画面に残す
</label>
</div>

<button type="button" id="parse-btn" class="favorite-button">
読み仮名を自動生成して確認する
</button>
</section>

<section id="step-2">
<h3>登録内容の確認・修正</h3>
<p class="help small">
読み仮名は自動生成されています。間違っているところだけ直接修正してください。
</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>アーティスト</th>
<th>アーティスト読み</th>
<th>曲名</th>
<th>曲名読み</th>
</tr>
</thead>
<tbody id="preview-body"></tbody>
</table>
</div>

<button type="button" id="submit-all-btn" class="favorite-button submit-button">
この内容で一括登録する
</button>
</section>

<div id="message"></div>
</main>
</body>
</html>
