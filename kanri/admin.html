<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面 - 歌リスト管理</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
      line-height: 1.6;
    }
    h1, h2 {
      border-bottom: 2px solid #ccc;
      padding-bottom: 5px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .message {
      margin-top: 10px;
      padding: 10px;
      display: none;
    }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }

    /* 配信者一覧用スタイル */
    /* 配信者一覧用スタイル（修正箇所） */
    .streamer-list {
      list-style: none;
      padding: 0;
      margin-top: 15px;

      /* スクロール用の設定 */
      max-height: 300px; /* 表示エリアの最大高さ（お好みで調整してください） */
      overflow-y: auto;  /* 中身が入りきらない場合に縦スクロールバーを表示 */
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px;
      background-color: #fff;
    }

    .streamer-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border: 1px solid #eee;
      margin-bottom: 8px;
      border-radius: 4px;
      background-color: #f9f9f9;
    }

    /* 最後のアイテムの下余白を削除 */
    .streamer-item:last-child {
      margin-bottom: 0;
    }
    .streamer-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border: 1px solid #ddd;
      margin-bottom: 8px;
      border-radius: 4px;
      background-color: #f9f9f9;
    }
    .streamer-info {
      display: flex;
      flex-direction: column;
    }
    .streamer-name {
      font-weight: bold;
      font-size: 1.05em;
    }
    .streamer-url-id {
      color: #666;
      font-size: 0.85em;
    }
  </style>

  <script type="module" src="./admin.js"></script>
</head>
<body>

  <h1>配信者・楽曲 管理画面</h1>

  <!-- 新規配信者登録フォーム -->
  <section>
    <h2>新規配信者の追加</h2>
    <form id="add-streamer-form">
      <div class="form-group">
        <label for="streamer-name">配信者名（表示用）</label>
        <input type="text" id="streamer-name" placeholder="例: 神楽みこと" required>
      </div>

      <div class="form-group">
        <label for="streamer-url-id">URL ID（英数字）</label>
        <input type="text" id="streamer-url-id" placeholder="例: mikoto" required>
      </div>

      <div class="form-group">
        <label for="streamer-bg">背景画像URL</label>
        <input type="text" id="streamer-bg" placeholder="https://...">
      </div>
		
		
		
		<!-- 追加：管理キー入力欄 -->
      <div class="form-group">
        <label for="management-key">管理キー</label>
        <input type="text" id="management-key" placeholder="例: key_hash用の値" required>
      </div>

      <!-- 追加：再設定コード入力欄 -->
      <div class="form-group">
        <label for="reset-key">再設定コード</label>
        <input type="text" id="reset-key" placeholder="例: reset_key_hash用の値" required>
      </div>
		

      <button type="submit">配信者を登録する</button>
    </form>
    <div id="streamer-message" class="message"></div>
  </section>

  <!-- 登録済み配信者一覧を表示するセクション（追加） -->
  <section style="margin-top: 40px;">
    <h2>登録済み配信者一覧</h2>
    <ul id="streamer-list" class="streamer-list">
      <li>読み込み中...</li>
    </ul>
  </section>

</body>
</html>
