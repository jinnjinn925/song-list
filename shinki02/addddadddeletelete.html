<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">

    <title>レパートリー管理</title>

    <link rel="stylesheet" href="add.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 処理スクリプト -->
    <script src="add.js" defer></script>
</head>

<body>

<main class="add-main">
	
	<section id="management-key-section">
    	<label for="management-key">
        	管理キー
    	</label>

    	<input
        	type="password"
        	id="management-key"
        	placeholder="管理キーを入力"
        	autocomplete="off"
    	>
	</section>
	
	<div id="reset-key-area">

    	<button
        	type="button"
        	id="show-reset-btn"
        	class="sub-button"
    	>
        	管理キーを忘れた場合
    	</button>

		<div
			id="reset-form"
			style="display:none;"
		>

			<label for="reset-key">
				再設定コード
			</label>

			<input
				type="text"
				id="reset-key"
				placeholder="再設定コードを入力"
				autocomplete="off"
			>

			<label for="new-management-key">
				新しい管理キー
			</label>

			<input
				type="password"
				id="new-management-key"
				placeholder="新しい管理キー"
				autocomplete="new-password"
			>

			<label for="new-management-key-confirm">
				新しい管理キー（確認）
			</label>

			<input
				type="password"
				id="new-management-key-confirm"
				placeholder="もう一度入力"
				autocomplete="new-password"
			>

			<button
				type="button"
				id="reset-management-key-btn"
				class="main-button"
			>
				管理キーを再設定
			</button>

			<div id="reset-message"></div>

		</div>

	</div>

    <h2>レパートリー管理</h2>

    <input type="hidden" id="streamer-id">


    <!-- =========================
         曲を追加
    ========================== -->

    <section id="input-section">

        <div class="section-header">

            <div>
                <h3>曲を追加</h3>

                <p>
                    1行に1曲ずつ入力してください。
                    「＋行を追加」で曲を増やせます。
                </p>
            </div>

        </div>


        <!-- 曲入力テーブル -->

        <div class="table-scroll">

            <table class="song-table input-table">

                <thead>
                    <tr>
                        <th>アーティスト</th>
                        <th>曲名</th>
                        <th>歌える状態</th>
                        <th>自信曲</th>
                    
                        <th class="delete-column"></th>
                    </tr>
                </thead>

                <tbody id="input-body">
                </tbody>

            </table>

        </div>


        <button
            type="button"
            id="add-row-btn"
            class="add-row-button">
            ＋ 行を追加
        </button>


        <button
            type="button"
            id="generate-btn"
            class="main-button">
            まとめて登録する
        </button>
		
		<div id="submit-error"></div>

    </section>


    <!-- =========================
         読み確認
    ========================== -->

    <section
        id="preview-section"
        style="display:none;">

        <div class="section-header">

            <div>
                <h3>読みを確認</h3>

                <p>
                    自動生成された読みを確認してください。
                    間違っているところは直接修正できます。
                </p>
            </div>

        </div>


        <div class="table-scroll">

            <table class="song-table preview-table">

                <thead>
                    <tr>
                        <th>アーティスト</th>
                        <th>アーティスト読み</th>
                        <th>曲名</th>
                        <th>曲名読み</th>
                        <th>歌える状態</th>
                        <th>自信曲</th>
                       
                        <th class="delete-column"></th>
                    </tr>
                </thead>

                <tbody id="preview-body">
                </tbody>

            </table>

        </div>


        <button
            type="button"
            id="back-btn"
            class="sub-button">
            入力に戻る
        </button>


        <button
            type="button"
            id="submit-all-btn"
            class="main-button">
            この内容で一括登録する
        </button>
		
		<div id="submit-error"></div>

    </section>
	
	
	<!-- 曲追加エリア等の後 -->

	<!-- ★好きな歌手の一括管理セクション（折りたたみ式） -->
	<section id="favorite-and-confident-section" class="management-section" style="padding: 16px; border: 1px solid #ddd; border-radius: 14px; background: #fff;">
		<details> <!-- 最初から開いておきたい場合は open を指定。閉じたちのうがよければ open を削除 -->
			<summary style="font-size: 19px; font-weight: bold; cursor: pointer; outline: none;">
				好きな歌手の設定
			</summary>

			<div class="favorite-artists-section" style="margin-top: 12px;">
				<div id="favorite-artist-checkboxes" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;"></div>
				<button type="button" id="update-favorites-btn">好きな歌手を保存</button>
			</div>
		</details>
	</section>




    <!-- =========================
         登録済みの曲を削除
    ========================== -->

    <section id="registered-section">

        <div class="section-header">

            <div>
                <h3>登録済みの曲の設定の変更または削除</h3>

                <p>
                    設定を変更したい項目を変更してください。　削除したい曲の左側のボックスにチェックを入れてください。　
                </p>
            </div>

        </div>


        <!-- 全選択 -->

       <div class="registered-controls">

		<div class="registered-search-row">
			<input
				type="search"
				id="registered-search"
				placeholder="アーティスト・曲名を検索"
				autocomplete="off"
			>

			<select id="registered-sort">
				<option value="artist">アーティスト順</option>
				<option value="title">曲名順</option>
				<option value="newest">登録が新しい順</option>
			</select>
		</div>

		<div class="registered-action-row">
			<label class="select-all-label">
				<input
					type="checkbox"
					id="select-all-songs"
				>
				表示中をすべて選択
			</label>

			<button
				type="button"
				id="reload-songs-btn"
				class="sub-button"
			>
				↻曲一覧を更新
			</button>
		</div>

	</div>


        <!-- 登録済み曲一覧 -->

        <div class="table-scroll">

            <table class="song-table registered-table">

                <thead>
                    <tr>
                        <th>選択</th>
                        <th>アーティスト</th>
                        <th>曲名</th>
                        <th>歌える状態</th>
                        <th>自信曲</th>
                    
                    </tr>
                </thead>

                <tbody id="registered-body">
                </tbody>

            </table>

        </div>


        <div class="registered-actions">
			<button id="delete-selected-btn" type="button">選択した曲を削除</button>
			<button id="save-registered-changes-btn" type="button">変更を保存</button>
		  
		</div>
    </section>


    <!-- メッセージ -->

    <div id="message"></div>

</main>

</body>
</html>
