<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配信者デザイン設定</title>
  <link rel="stylesheet" href="../add.js">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./setting.js"></script>
</head>
<body>

<main class="add-main">
  <h2>配信者デザイン設定</h2>

  <!-- 管理キー入力エリア -->
  <section id="management-key-section" style="margin-bottom: 20px;">
    <label for="management-key" style="display:block; font-weight:bold; margin-bottom:8px;">管理キー</label>
    <input
      type="password"
      id="management-key"
      placeholder="管理キーを入力"
      autocomplete="off"
      style="width:100%; height:44px; padding:0 12px; border:1px solid #ccc; border-radius:8px; font-size:16px;"
    >
  </section>

  <!-- デザインカスタマイズフォーム -->
  <section id="editor-section">
    <form id="custom-form">
      <input type="hidden" id="streamer-id">

      <!-- フォント指定 -->
      <div class="form-group" style="margin-bottom:16px;">
        <label for="font-family" style="display:block; font-weight:bold; margin-bottom:6px;">フォント (font_family)</label>
        <select id="font-family" style="width:100%; height:42px; padding:0 10px; border-radius:8px; border:1px solid #ccc;">
          <option value="sans-serif">ゴシック体 (sans-serif)</option>
          <option value="serif">明朝体 (serif)</option>
          <option value="'Yu Gothic', '遊ゴシック', sans-serif">遊ゴシック</option>
          <option value="cursive">手書き風 (cursive)</option>
        </select>
      </div>

      <!-- テーマカラー -->
      <div class="form-group" style="margin-bottom:16px;">
        <label for="theme-color" style="display:block; font-weight:bold; margin-bottom:6px;">テーマカラー (theme_color)</label>
        <div style="display:flex; align-items:center; gap:12px;">
          <input type="color" id="theme-color" value="#007bff" style="width:50px; height:42px; border:none; cursor:pointer;">
          <span id="theme-color-code">#007bff</span>
        </div>
      </div>

      <!-- 文字色 -->
      <div class="form-group" style="margin-bottom:16px;">
        <label for="text-color" style="display:block; font-weight:bold; margin-bottom:6px;">文字色 (text_color)</label>
        <div style="display:flex; align-items:center; gap:12px;">
          <input type="color" id="text-color" value="#333333" style="width:50px; height:42px; border:none; cursor:pointer;">
          <span id="text-color-code">#333333</span>
        </div>
      </div>

      <!-- プレビュー -->
      <div id="preview-area" style="padding:16px; border:1px solid #ddd; border-radius:8px; text-align:center; margin-top:20px;">
        <p style="margin:0 0 8px;">プレビュー表示（歌リストの見え方）</p>
        <button type="button" id="preview-btn" style="padding:8px 16px; border:none; border-radius:4px; color:#fff;">テーマ色ボタン</button>
      </div>

      <button type="submit" id="save-design-btn" class="main-button" style="margin-top:20px;">デザイン設定を保存する</button>
    </form>

    <div id="status-message" style="margin-top:16px; padding:10px; border-radius:8px; display:none;"></div>
  </section>
</main>

</body>
</html>
