<!doctype html>
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デザインカスタム - 歌リスト管理</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 0 15px;
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }
    select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    .color-picker-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    input[type="color"] {
      width: 50px;
      height: 40px;
      border: none;
      cursor: pointer;
      background: none;
    }
    /* リアルタイムプレビュー枠 */
    .preview-box {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      text-align: center;
      transition: all 0.2s ease;
    }
    .preview-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      margin-top: 10px;
    }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 20px;
    }
    button[type="submit"]:hover {
      background-color: #218838;
    }
    .message {
      margin-top: 15px;
      padding: 10px;
      display: none;
      border-radius: 4px;
    }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
  </style>

  <script type="module" src="./setting.js"></script>
</head>
<body>

  <h1>配信者デザイン設定</h1>

  <form id="custom-form">
    <!-- 配信者選択 -->
    <div class="form-group">
      <label for="streamer-select">対象の配信者を選択</label>
      <select id="streamer-select" required>
        <option value="">読み込み中...</option>
      </select>
    </div>

    <!-- フォント指定 -->
    <div class="form-group">
      <label for="font-family">フォント（font_family）</label>
      <select id="font-family">
        <option value="sans-serif">ゴシック体 (sans-serif)</option>
        <option value="serif">明朝体 (serif)</option>
        <option value="'ヒラギノ角ゴ Pro W3', 'Hiragino Kaku Gothic Pro', sans-serif">ヒラギノ角ゴ</option>
        <option value="'Yu Gothic', '遊ゴシック', sans-serif">遊ゴシック</option>
        <option value="cursive">手書き風 (cursive)</option>
      </select>
    </div>

    <!-- テーマカラー -->
    <div class="form-group">
      <label for="theme-color">テーマカラー (theme_color)</label>
      <div class="color-picker-group">
        <input type="color" id="theme-color" value="#007bff">
        <span id="theme-color-code">#007bff</span>
      </div>
    </div>

    <!-- テキストカラー -->
    <div class="form-group">
      <label for="text-color">文字色 (text_color)</label>
      <div class="color-picker-group">
        <input type="color" id="text-color" value="#333333">
        <span id="text-color-code">#333333</span>
      </div>
    </div>

    <!-- プレビュー -->
    <div id="preview-area" class="preview-box">
      <h3 style="margin-top:0;">プレビュー表示</h3>
      <p>文字やボタンの見た目がこのように変化します。</p>
      <button type="button" id="preview-btn" class="preview-btn">ボタンのテーマ色</button>
    </div>

    <button type="submit">デザイン設定を保存する</button>
  </form>

  <div id="status-message" class="message"></div>

</body>
</html>
