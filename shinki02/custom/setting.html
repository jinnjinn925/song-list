<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配信者デザイン設定</title>

  <!-- 404エラー防止用のファビコン指定 -->
  <link rel="icon" href="data:,">

  <!-- ★修正: JSファイルではなくCSSファイルを読み込みます -->
  <link rel="stylesheet" href="../add.css">

  <style>
    /* =========================================
       カラー設定 & プリセットチップ用CSS
       ========================================= */
    .preset-colors {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    /* 丸型プリセットボタン (タップしやすい38pxサイズ) */
    .color-chip {
      width: 38px;
      height: 38px;
      padding: 0;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      outline: none;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .color-chip:hover {
      transform: scale(1.08);
    }

    .color-chip:active {
      transform: scale(0.92);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    /* カラーピッカーの装飾クリア */
    input[type="color"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      padding: 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    input[type="text"]#theme-color-code,
    input[type="text"]#text-color-code {
      font-family: monospace;
      letter-spacing: 0.5px;
      text-transform: lowercase;
    }
  </style>

  <!-- Supabase & メインスクリプト -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./setting.js"></script>
</head>
<body>

<main class="add-main">
  <h2>配信者デザイン設定</h2>

  <!-- 管理キー入力エリア -->
  <section id="management-key-section" style="margin-bottom: 20px;">
    <label for="management-key" style="display:block; font-weight:bold; margin-bottom:8px;">管理キー</label>
    <input
      type="password"
      id="management-key"
      placeholder="管理キーを入力"
      autocomplete="off"
      style="width:100%; height:44px; padding:0 12px; border:1px solid #ccc; border-radius:8px; font-size:16px;"
    >
  </section>

  <!-- デザインカスタマイズフォーム -->
  <section id="editor-section">
    <form id="custom-form">
      <input type="hidden" id="streamer-id">

      <!-- 1. フォント指定 -->
      <div class="form-group" style="margin-bottom:20px;">
        <label for="font-family" style="display:block; font-weight:bold; margin-bottom:8px;">フォント (font_family)</label>
        <select id="font-family" style="width:100%; height:48px; padding:0 12px; border-radius:10px; border:1px solid #ccc; font-size:16px;">
          <option value="sans-serif">ゴシック体 (sans-serif)</option>
          <option value="serif">明朝体 (serif)</option>
          <option value="'Yu Gothic', '遊ゴシック', sans-serif">遊ゴシック</option>
          <option value="cursive">手書き風 (cursive)</option>
        </select>
      </div>
		
	
		<!-- 4. 背景画像 (Storage連携) -->
	<div class="form-group" style="margin-bottom:20px;">
	  <label style="display:block; font-weight:bold; margin-bottom:8px;">背景画像</label>

	  <!-- ファイルアップロード -->
	  <input 
		type="file" 
		id="bg-file-input" 
		accept="image/*"
		style="width:100%; padding:8px; border:1px solid #ccc; border-radius:8px; background:#fff; font-size:14px;"
	  >

	  <!-- URL直接保持用（非表示） -->
	  <input type="hidden" id="background-url">

	  <!-- 削除・クリアボタン -->
	  <div style="margin-top:8px;">
		<button type="button" id="remove-bg-btn" style="padding:6px 12px; border:1px solid #dc3545; color:#dc3545; background:#fff; border-radius:6px; font-size:12px; cursor:pointer;">背景画像を削除する</button>
	  </div>
	</div>
		
		

      <!-- 2. テーマカラー (theme_color) -->
      <div class="form-group" style="margin-bottom:20px;">
        <label style="display:block; font-weight:bold; margin-bottom:8px;">テーマカラー (theme_color)</label>

        <!-- プリセット（ワンタップ選択） -->
        <!-- テーマカラー (theme_color) のプリセットを変更 -->
		<div class="preset-colors">
		  <!-- くすみブルー (落ち着いたメイン) -->
		  <button type="button" class="color-chip" style="background:#4A7C59;" data-target="theme" data-color="#4A7C59"></button>
		  <!-- スモーキーブルー -->
		  <button type="button" class="color-chip" style="background:#4A6FA5;" data-target="theme" data-color="#4A6FA5"></button>
		  <!-- くすみピンク / ローズ -->
		  <button type="button" class="color-chip" style="background:#B86B77;" data-target="theme" data-color="#B86B77"></button>
		  <!-- アッシュパープル -->
		  <button type="button" class="color-chip" style="background:#7B68EE;" data-target="theme" data-color="#7B68EE"></button>
		  <!-- マスタード / ウォームオークル -->
		  <button type="button" class="color-chip" style="background:#C68B59;" data-target="theme" data-color="#C68B59"></button>
		  <!-- チャコールブラック -->
		  <button type="button" class="color-chip" style="background:#2C3E50;" data-target="theme" data-color="#2C3E50"></button>
		</div>

        <!-- ピッカー ＋ コード直接入力 -->
        <div style="display:flex; align-items:center; gap:10px;">
          <input type="color" id="theme-color" value="#007bff" style="width:50px; height:44px; border:none; background:none; cursor:pointer;">
          <input type="text" id="theme-color-code" value="#007bff" placeholder="#007bff" maxlength="7" style="width:120px; height:44px; padding:0 10px; border:1px solid #ccc; border-radius:8px; font-size:16px;">
        </div>
      </div>

      <!-- 3. 文字色 (text_color) -->
      <!-- 1. タイトル文字色 (text_color) -->
      <div class="form-group" style="margin-bottom:20px;">
        <label style="display:block; font-weight:bold; margin-bottom:8px;">タイトル文字色 (text_color)</label>

        <!-- プリセット -->
        <div class="preset-colors">
          <button type="button" class="color-chip" style="background:#222222;" data-target="text" data-color="#222222"></button>
          <button type="button" class="color-chip" style="background:#444444;" data-target="text" data-color="#444444"></button>
          <button type="button" class="color-chip" style="background:#184f88;" data-target="text" data-color="#184f88"></button>
          <button type="button" class="color-chip" style="background:#ffffff; border:1px solid #ccc;" data-target="text" data-color="#ffffff"></button>
        </div>

        <!-- ピッカー ＋ コード直接入力 -->
        <div style="display:flex; align-items:center; gap:10px;">
          <input type="color" id="text-color" value="#222222" style="width:50px; height:44px; border:none; background:none; cursor:pointer;">
          <input type="text" id="text-color-code" value="#222222" placeholder="#222222" maxlength="7" style="width:120px; height:44px; padding:0 10px; border:1px solid #ccc; border-radius:8px; font-size:16px;">
        </div>
      </div>

      <!-- 2. アーティスト・曲名文字色 (artist_color) -->
      <div class="form-group" style="margin-bottom:20px;">
        <label style="display:block; font-weight:bold; margin-bottom:8px;">アーティスト・曲名文字色 (artist_color)</label>

        <!-- プリセット -->
        <div class="preset-colors">
          <button type="button" class="color-chip" style="background:#222222;" data-target="artist-text" data-color="#222222"></button>
          <button type="button" class="color-chip" style="background:#444444;" data-target="artist-text" data-color="#444444"></button>
          <button type="button" class="color-chip" style="background:#184f88;" data-target="artist-text" data-color="#184f88"></button>
          <button type="button" class="color-chip" style="background:#ffffff; border:1px solid #ccc;" data-target="artist-text" data-color="#ffffff"></button>
        </div>

        <!-- ピッカー ＋ コード直接入力 -->
        <div style="display:flex; align-items:center; gap:10px;">
          <input type="color" id="artist-text-color" value="#444444" style="width:50px; height:44px; border:none; background:none; cursor:pointer;">
          <input type="text" id="artist-text-color-code" value="#444444" placeholder="#444444" maxlength="7" style="width:120px; height:44px; padding:0 10px; border:1px solid #ccc; border-radius:8px; font-size:16px;">
        </div>
      </div>

      <!-- 4. リアルタイムプレビュー -->
      <div id="preview-area" style="padding: 24px; border: 1px solid #ddd; border-radius: 12px; margin-top: 20px; min-height: 220px; box-sizing: border-box; background-repeat: no-repeat; background-size: cover; background-position: center;">
        <p style="margin: 0 0 16px; font-weight: bold; font-size: 14px; color: #666; text-align: center;">プレビュー表示（本番の見え方）</p>

        <!-- 本番風カードコンテナ -->
        <div style="max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;">
          <!-- タイトル部 -->
          <h3 id="preview-title" style="margin: 0; font-size: 22px; font-weight: bold; text-align: center;">サンプル配信タイトル</h3>

          <!-- アーティスト・曲名（本番同様の半透明カード付き） -->
          <div id="preview-artist-card" style="padding: 16px; border-radius: 10px; background-color: rgba(255, 255, 255, 0.85); backdrop-filter: blur(4px); box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <div id="preview-artist" style="font-size: 16px; line-height: 1.5; font-weight: 500;">
              <div>♪ アーティスト名 - 演奏楽曲タイトル</div>
              <div style="font-size: 13px; opacity: 0.8; margin-top: 4px;">※ 本番表示カードのサンプル表示</div>
            </div>
          </div>

          <!-- テーマカラー適用ボタン -->
          <div style="text-align: center;">
            <button type="button" id="preview-btn" style="padding: 12px 28px; border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 15px; cursor: pointer;">サンプルボタン</button>
          </div>
        </div>
      </div>
      <button type="submit" id="save-design-btn" class="main-button" style="margin-top:24px; height:50px; font-size:16px;">デザイン設定を保存する</button>
    </form>

    <div id="status-message" style="margin-top:16px; padding:10px; border-radius:8px; display:none;"></div>
  </section>
</main>

</body>
</html>
