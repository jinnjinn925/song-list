<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配信者デザイン設定</title>

  <!-- ここにあった 404エラー防止用のファビコン指定を削除し、以下を追加 -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">

  <!-- Google Fonts 読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Kaisei+Tokumin&family=Kiwi+Maru&family=M+PLUS+Rounded+1c:wght@400;700&family=Shippori+Mincho&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../add.css">

  <style>
    /* =========================================
       カラー設定 & プリセットチップ用CSS
       ========================================= */
    .preset-colors {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    /* 丸型プリセットボタン */
    .color-chip {
      width: 38px;
      height: 38px;
      padding: 0;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      outline: none;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .color-chip:hover {
      transform: scale(1.08);
    }

    .color-chip:active {
      transform: scale(0.92);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    /* カラーピッカーの装飾クリア */
    input[type="color"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      padding: 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    input[type="text"].color-code-input {
      font-family: monospace;
      letter-spacing: 0.5px;
      text-transform: lowercase;
    }
  </style>

  <!-- Supabase & メインスクリプト -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./setting.js"></script>
</head>
<body>

<main class="add-main" style="max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2>配信者デザイン設定</h2>
	
	
	<!-- ★移動ナビゲーションリンクを追加 -->
	  <div style="margin-bottom: 20px; display: flex; gap: 10px;">
		<a href="#" class="nav-link-keep-params" data-target="../addddadddeletelete-mobile.html" style="text-decoration: underline; color: #007bff;">曲の登録・管理画面へ</a>
	  </div>
	

  <!-- 管理キー入力エリア -->
  <section id="management-key-section" style="margin-bottom: 20px;">
    <label for="management-key" style="display:block; font-weight:bold; margin-bottom:8px;">管理キー</label>
    <input
      type="password"
      id="management-key"
      placeholder="管理キーを入力"
      autocomplete="off"
      style="width:100%; height:44px; padding:0 12px; border:1px solid #ccc; border-radius:8px; font-size:16px; box-sizing:border-box;"
    >
  </section>

  <!-- デザインカスタマイズフォーム -->
  <section id="editor-section">
    <form id="custom-form">
      <input type="hidden" id="streamer-id">

      <!-- 1. フォント指定 -->
      <div class="form-group" style="margin-bottom:20px;">
        <label for="font-family" style="display:block; font-weight:bold; margin-bottom:8px;">フォント（書体）</label>
        <select id="font-family" style="width:100%; height:48px; padding:0 12px; border-radius:10px; border:1px solid #ccc; font-size:16px; box-sizing:border-box;">
          <optgroup label="標準フォント">
            <option value="sans-serif">ゴシック体 (標準)</option>
            <option value="serif">明朝体 (標準)</option>
            <option value="'Yu Gothic', '遊ゴシック', sans-serif">遊ゴシック</option>
            <option value="monospace">等幅フォント</option>
          </optgroup>
          <optgroup label="デザイン・Webフォント">
            <option value="'M PLUS Rounded 1c', sans-serif">丸ゴシック（M PLUS Rounded）</option>
            <option value="'Kiwi Maru', serif">キウイ丸（ポップ系丸ゴシック）</option>
            <option value="'Dela Gothic One', cursive">Dela Gothic（極太インパクト）</option>
            <option value="'Shippori Mincho', serif">しっぽり明朝（高級感・和風）</option>
            <option value="'Kaisei Tokumin', serif">快星トクミン（モダン和風）</option>
          </optgroup>
        </select>
      </div>

      <!-- 2. 背景画像 -->
      <div class="form-group" style="margin-bottom:20px;">
        <label style="display:block; font-weight:bold; margin-bottom:8px;">背景画像</label>
        <input 
          type="file" 
          id="bg-file-input" 
          accept="image/*"
          style="width:100%; padding:8px; border:1px solid #ccc; border-radius:8px; background:#fff; font-size:14px; box-sizing:border-box;"
        >
        <input type="hidden" id="background-url">

        <div style="margin-top:8px;">
          <button type="button" id="remove-bg-btn" style="padding:6px 12px; border:1px solid #dc3545; color:#dc3545; background:#fff; border-radius:6px; font-size:12px; cursor:pointer;">背景画像を削除する</button>
        </div>
      </div>

      <!-- 3. テーマカラー -->
      <div class="form-group" style="margin-bottom:20px;">
        <label style="display:block; font-weight:bold; margin-bottom:8px;">テーマカラー（ボタン・アクセント色）</label>
        <div class="preset-colors">
          <button type="button" class="color-chip" style="background:#4A7C59;" data-target="theme" data-color="#4A7C59"></button>
          <button type="button" class="color-chip" style="background:#4A6FA5;" data-target="theme" data-color="#4A6FA5"></button>
          <button type="button" class="color-chip" style="background:#B86B77;" data-target="theme" data-color="#B86B77"></button>
          <button type="button" class="color-chip" style="background:#7B68EE;" data-target="theme" data-color="#7B68EE"></button>
          <button type="button" class="color-chip" style="background:#C68B59;" data-target="theme" data-color="#C68B59"></button>
          <button type="button" class="color-chip" style="background:#2C3E50;" data-target="theme" data-color="#2C3E50"></button>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <input type="color" id="theme-color" value="#007bff" style="width:50px; height:44px; background:none; cursor:pointer;">
          <input type="text" id="theme-color-code" class="color-code-input" value="#007bff" placeholder="#007bff" maxlength="7" style="width:120px; height:44px; padding:0 10px; border:1px solid #ccc; border-radius:8px; font-size:16px;">
        </div>
      </div>

      <!-- 4. タイトル文字色 -->
      <div class="form-group" style="margin-bottom:20px;">
        <label style="display:block; font-weight:bold; margin-bottom:8px;">タイトル文字色</label>
        <div class="preset-colors">
          <button type="button" class="color-chip" style="background:#222222;" data-target="title-text" data-color="#222222"></button>
          <button type="button" class="color-chip" style="background:#444444;" data-target="title-text" data-color="#444444"></button>
          <button type="button" class="color-chip" style="background:#184f88;" data-target="title-text" data-color="#184f88"></button>
          <button type="button" class="color-chip" style="background:#ffffff; border:1px solid #ccc;" data-target="title-text" data-color="#ffffff"></button>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <input type="color" id="title-text-color" value="#222222" style="width:50px; height:44px; background:none; cursor:pointer;">
          <input type="text" id="title-text-color-code" class="color-code-input" value="#222222" placeholder="#222222" maxlength="7" style="width:120px; height:44px; padding:0 10px; border:1px solid #ccc; border-radius:8px; font-size:16px;">
        </div>
      </div>

      <!-- 5. アーティスト・曲名文字色 -->
      <div class="form-group" style="margin-bottom:20px;">
        <label style="display:block; font-weight:bold; margin-bottom:8px;">曲リスト・アーティスト文字色</label>
        <div class="preset-colors">
          <button type="button" class="color-chip" style="background:#222222;" data-target="artist-text" data-color="#222222"></button>
          <button type="button" class="color-chip" style="background:#444444;" data-target="artist-text" data-color="#444444"></button>
          <button type="button" class="color-chip" style="background:#184f88;" data-target="artist-text" data-color="#184f88"></button>
          <button type="button" class="color-chip" style="background:#ffffff; border:1px solid #ccc;" data-target="artist-text" data-color="#ffffff"></button>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <input type="color" id="artist-text-color" value="#444444" style="width:50px; height:44px; background:none; cursor:pointer;">
          <input type="text" id="artist-text-color-code" class="color-code-input" value="#444444" placeholder="#444444" maxlength="7" style="width:120px; height:44px; padding:0 10px; border:1px solid #ccc; border-radius:8px; font-size:16px;">
        </div>
      </div>

      <!-- 6. リアルタイムプレビュー -->
      <div id="preview-area" style="padding: 24px; border: 1px solid #ddd; border-radius: 12px; margin-top: 20px; min-height: 220px; box-sizing: border-box; background-repeat: no-repeat; background-size: cover; background-position: center;">
        <p style="margin: 0 0 16px; font-weight: bold; font-size: 14px; color: #666; text-align: center;">プレビュー表示</p>

        <div style="max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;">
          <h3 id="preview-title" style="margin: 0; font-size: 22px; font-weight: bold; text-align: center;">サンプル配信タイトル</h3>

          <div id="preview-artist-card" style="padding: 16px; border-radius: 10px; background-color: rgba(255, 255, 255, 0.2); backdrop-filter: blur(4px); box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <div id="preview-artist" style="font-size: 16px; line-height: 1.5; font-weight: 500;">
              <div>♪ アーティスト名 - 演奏楽曲タイトル</div>
              <div style="font-size: 13px; opacity: 0.8; margin-top: 4px;">※ 本番表示カードのサンプル表示</div>
            </div>
          </div>

          <div style="text-align: center;">
            <button type="button" id="preview-btn" style="padding: 12px 28px; border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 15px; cursor: pointer;">サンプルボタン</button>
          </div>
        </div>
      </div>

      <button type="submit" id="save-design-btn" class="main-button" style="margin-top:24px; width:100%; height:50px; font-size:16px; font-weight:bold; cursor:pointer;">デザイン設定を保存する</button>
    </form>

    <div id="status-message" style="margin-top:16px; padding:12px; border-radius:8px; display:none; text-align:center;"></div>
  </section>
</main>
	
	
	<script>
    // URLのパラメータ (?以降) を保持したままリンク遷移する処理
    document.addEventListener('DOMContentLoaded', () => {
      const searchParams = window.location.search;
      document.querySelectorAll('.nav-link-keep-params').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const target = link.getAttribute('data-target');
          window.location.href = target + searchParams;
        });
      });
    });
  </script>

</body>
</html>
