<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>レパートリー一括登録</title>
    <link rel="stylesheet" href="ao_2.css">

    <!-- 1. Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. kuromoji.js（deferを付けて先に読み込みを確保） -->
    <!-- npm/kuromoji/build/kuromoji.js に変更（バージョン番号を外す） -->
	<script src="https://cdn.jsdelivr.net/npm/kuromoji@latest/build/kuromoji.js" defer></script>
    
    <!-- 3. 自作のJS（deferを付けてkuromojiの後に実行させる） -->
    <script src="add.js" defer></script>
</head>
<body>

    <main style="max-width: 700px; margin: 20px auto; padding: 20px;">
        <h2>レパートリー一括登録</h2>

        <!-- 配信者ID（URLの ?id=1 から自動セットされる隠し枠） -->
        <input type="hidden" id="streamer-id">

        <!-- STEP 1: コピペ枠 -->
        <div id="step-1">
            <p style="font-size:14px; color:#555;">「アーティスト名,曲名」の形で貼り付けてください。</p>
            <textarea id="csv-input" rows="8" style="width:100%; padding:10px;" placeholder="ヨルシカ,言え。
コブクロ,赤い糸
Hump Back,拝啓、少年よ"></textarea>
            
            <button type="button" id="parse-btn" class="favorite-button" style="width:100%; margin-top:10px; padding:12px;">
                ふりがなを自動生成して確認する
            </button>
        </div>

        <!-- STEP 2: プレビュー＆修正枠（初期状態は非表示） -->
        <div id="step-2" style="display:none; margin-top:24px;">
            <h3>登録内容の確認・修正</h3>
            <p style="font-size:13px; color:#666;">読みが間違っている部分だけ、直接打ち換えて修正してください。</p>
            
            <table style="width:100%; border-collapse:collapse; margin-top:10px;">
                <thead>
                    <tr style="background:#f0f0f0; text-align:left;">
                        <th style="padding:8px;">アーティスト</th>
                        <th style="padding:8px;">読み（修正可）</th>
                        <th style="padding:8px;">曲名</th>
                        <th style="padding:8px;">読み（修正可）</th>
                    </tr>
                </thead>
                <tbody id="preview-body">
                    <!-- JSでここに行が作られます -->
                </tbody>
            </table>

            <button type="button" id="submit-all-btn" class="favorite-button" style="width:100%; margin-top:16px; padding:12px; font-weight:bold;">
                この内容で一括登録する
            </button>
        </div>

        <div id="message" style="margin-top: 15px; font-weight: bold;"></div>
    </main>

   
</body>
</html>
