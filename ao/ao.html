<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Song List</title>
	
	<link rel="stylesheet" href="ao.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header id="page-header">
    	<h1 id="streamer-name"></h1>

    	<div id="song-count">
        	曲数：読み込み中...
    	</div>
	</header>

	<div id="menu-panel" class="menu-panel">
    	<div class="search-box">
        	<input
            	id="song-search"
            	type="search"
            	placeholder="曲名・アーティスト名で検索"
            	autocomplete="off"
        	>
        	<button id="search-clear" type="button">クリア</button>
    	</div>
	</div>

    <section id="favorite-section">
        <!-- ボタンをまとめてこの中に入れる -->
        <div id="favorite-artists">
            <button id="complete-filter" class="favorite-button">
                *最後まで歌える曲だけ表示
            </button>
        </div>
    </section>


    <div id="artist-nav"></div>

    <div id="song-list">
        読み込み中...
    </div>


    <script src ="ao.js"></script>

</body>
</html>
